# Apply trained checkpoints to every subject in the indexed raw dataset.
dataset_dir = "data/indexed"
output_dir = "experiments/inference"
detector_checkpoint_path = "experiments/default/train/detector/checkpoints/best_model.pth"
student_checkpoint_path = "experiments/default/train/student/checkpoints/best_model.pth"
# Match the method used to preprocess the training data: "fast" or "n4".
bias_field_correction = "fast"
# Use float16 autocast for CUDA inference.
use_amp = false
device = "cpu"