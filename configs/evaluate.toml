# Evaluate the held-out test split from a completed training experiment.
# Checkpoint and output paths are derived from experiment_dir.
dataset_dir = "/path/to/indexed/and/preprocessed/dataset"
experiment_dir = "/path/to/commpleted/experiment/containing/training/artifacts"
# Match the method used to preprocess the training data: "fast" or "n4".
bias_field_correction = "n4"
# Use bfloat16 autocast for CUDA inference.
use_amp = true
device = "cuda"